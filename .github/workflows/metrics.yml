name: Update Stats Cards

on:
  # 每天 UTC 0 点自动更新一次
  schedule:
    - cron: "0 0 * * *"
  # 支持手动触发
  workflow_dispatch:
  # push 到主分支时也更新
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats cards from github-readme-stats
        run: |
          fetch() {
            local url="$1" out="$2"
            curl -fsSL --retry 5 --retry-delay 30 -o "$out.tmp" "$url"
            # API 限流时会返回一张错误卡片,此时保留旧图不覆盖
            if grep -q "Something went wrong" "$out.tmp"; then
              echo "::warning::$out 获取失败(API 限流),保留旧图"
              rm -f "$out.tmp"
            else
              mv "$out.tmp" "$out"
            fi
          }
          fetch "https://github-readme-stats.vercel.app/api?username=LeslieZhoa&show_icons=true&theme=dark&rank_icon=default&include_all_commits=true" github-stats.svg
          fetch "https://github-readme-stats.vercel.app/api/top-langs/?username=LeslieZhoa&theme=dark&layout=compact" top-langs.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git diff --cached --quiet || (git commit -m "chore: update stats cards" && git push)
