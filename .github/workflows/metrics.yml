name: Update Stats Cards

on:
  # 每天 UTC 0 点自动更新一次
  schedule:
    - cron: "0 0 * * *"
  # 支持手动触发
  workflow_dispatch:
  # push 到主分支时也更新
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 拉取 github-readme-stats 源码,在本地渲染卡片(不依赖官方 Vercel 服务)
      - uses: actions/checkout@v4
        with:
          repository: anuraghazra/github-readme-stats
          path: grs

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: grs
        run: npm ci --ignore-scripts

      - name: Generate cards locally
        env:
          # github-readme-stats 从 PAT_1 环境变量读取 token
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > grs/generate.mjs <<'EOF'
          import fs from "fs";
          import { fetchStats } from "./src/fetchers/stats.js";
          import { renderStatsCard } from "./src/cards/stats.js";
          import { fetchTopLanguages } from "./src/fetchers/top-languages.js";
          import { renderTopLanguages } from "./src/cards/top-languages.js";

          const username = "LeslieZhoa";

          const stats = await fetchStats(username, true);
          fs.writeFileSync(
            "../github-stats.svg",
            renderStatsCard(stats, {
              theme: "dark",
              show_icons: true,
              rank_icon: "default",
              include_all_commits: true,
            })
          );

          const langs = await fetchTopLanguages(username);
          fs.writeFileSync(
            "../top-langs.svg",
            renderTopLanguages(langs, { theme: "dark", layout: "compact" })
          );
          EOF
          cd grs && node generate.mjs

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git diff --cached --quiet || (git commit -m "chore: update stats cards" && git push)
